<!DOCTYPE html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <title>AKILI Splash</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;

        font-family: Inter, Arial, sans-serif;

        background: radial-gradient(
          circle at 50% 35%,
          #ffffff 0%,
          #f8fafc 45%,
          #eef2f7 100%
        );

        display: flex;
        align-items: center;
        justify-content: center;

        color: #1f2937;
      }

      body {
        animation: fadeIn 0.6s ease;
      }

      /* subtle gold ambient glow */
      body::before {
        content: "";

        position: absolute;

        width: 650px;
        height: 650px;

        background: radial-gradient(
          circle,
          rgba(242, 183, 5, 0.1),
          transparent 70%
        );

        animation: pulse 5s infinite ease-in-out;

        pointer-events: none;
      }

      .container {
        position: relative;
        z-index: 2;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        text-align: center;

        width: 100%;
        height: 100%;
      }

      /* =========================
     LOGO
  ========================= */

      .logo-wrapper {
        margin-bottom: 14px;

        position: relative;
      }

      .logo {
        font-size: 100px;
        font-weight: 900;

        letter-spacing: -10px;

        display: flex;
        align-items: center;
        justify-content: center;

        line-height: 1;

        text-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
      }

      .logo .l {
        color: #1f2937;
      }

      .logo .w {
        color: #f2b705;

        margin-left: -8px;
      }

      /* =========================
     APP NAME
  ========================= */

      .subtitle {
        font-size: 24px;

        font-weight: 500;

        color: #64748b;

        letter-spacing: 0.2px;

        margin-bottom: 20px;
      }

      /* =========================
     GOLD LINE
  ========================= */

      .line {
        width: 110px;
        height: 3px;

        background: #f2b705;

        border-radius: 999px;

        margin-bottom: 28px;

        box-shadow: 0 2px 8px rgba(242, 183, 5, 0.2);
      }

      /* =========================
     LOADER
  ========================= */

      .loader {
        display: flex;
        align-items: center;
        justify-content: center;

        gap: 10px;

        margin-bottom: 52px;
      }

      .dot {
        width: 11px;
        height: 11px;

        border-radius: 50%;

        background: #f2b705;

        box-shadow: 0 2px 6px rgba(242, 183, 5, 0.2);

        animation: bounce 1.2s infinite ease-in-out;
      }

      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      /* =========================
     FOOTER
  ========================= */

      .footer {
        display: flex;
        flex-direction: column;
        align-items: center;

        color: #94a3b8;

        font-size: 15px;
      }

      .footer-line {
        width: 300px;
        height: 1px;

        background: #d7dde5;

        margin-bottom: 24px;

        position: relative;
      }

      .footer-line::after {
        content: "◆";

        position: absolute;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        background: #f8fafc;

        padding: 0 14px;

        color: #f2b705;

        font-size: 10px;
      }

      .footer-company {
        color: #334155;

        font-size: 19px;

        font-weight: 700;

        margin-top: 7px;
        margin-bottom: 6px;
      }

      .footer-tagline {
        font-size: 14px;

        color: #94a3b8;

        letter-spacing: 0.2px;
      }

      /* =========================
     ANIMATIONS
  ========================= */

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0.7);
          opacity: 0.35;
        }

        40% {
          transform: scale(1.15);
          opacity: 1;
        }
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 0.55;
        }

        50% {
          transform: scale(1.08);
          opacity: 1;
        }

        100% {
          transform: scale(1);
          opacity: 0.55;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.985);
        }

        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes fadeOut {
        from {
          opacity: 1;
        }

        to {
          opacity: 0;
        }
      }

      body.fade-out {
        animation: fadeOut 0.5s ease forwards;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- AKILI LOGO -->
      <div class="logo-wrapper">
        <div class="logo">
          <span class="l">A</span>
          <span class="w">K</span>
          <span class="l">I</span>
          <span class="w">L</span>
          <span class="l">I</span>
        </div>
      </div>

      <!-- DESCRIPTION -->
      <div class="subtitle">Gestion d’entreprise</div>

      <!-- GOLD ACCENT -->
      <div class="line"></div>

      <!-- LOADING -->
      <div class="loader">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <!-- DEVELOPER -->
      <div class="footer">
        <div class="footer-line"></div>

        <div>Développé par</div>

        <div class="footer-company">ADB Tech Solutions</div>

        <div class="footer-tagline">Solutions numériques sur mesure</div>
      </div>
    </div>
  </body>
</html>
